name: duckdb-20-poc

x-duckdb-environment: &duckdb-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ducklake
  POSTGRES_USER: ducklake
  POSTGRES_PASSWORD: ducklake
  S3_ENDPOINT: rustfs:9000
  S3_ACCESS_KEY: rustfsadmin
  S3_SECRET_KEY: rustfsadmin
  S3_REGION: us-east-1
  S3_BUCKET: ducklake-poc
  QUACK_HOST: 0.0.0.0
  QUACK_PORT: "9494"
  QUACK_CLIENT_HOST: duckdb-server
  QUACK_TOKEN: duckdb-20-poc-token
  DUCKDB_THREADS: "6"
  DUCKDB_MEMORY_LIMIT: 6GB
  PARQUET_PREFETCH_COLUMN_GAP: ${PARQUET_PREFETCH_COLUMN_GAP:-0}
  BENCHMARK_RESULTS_DIR: /app/benchmark-results

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ducklake
      POSTGRES_USER: ducklake
      POSTGRES_PASSWORD: ducklake
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ducklake -d ducklake"]
      interval: 2s
      timeout: 5s
      retries: 20
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped

  rustfs-permissions:
    image: alpine:3.22
    user: root
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    command: ["sh", "-c", "chown -R 10001:10001 /data /logs"]
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.1
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    cpus: 2.0
    mem_limit: 2g
    restart: unless-stopped

  rustfs-init:
    image: amazon/aws-cli:2.37.9
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket ducklake-poc >/dev/null 2>&1; then
          echo "Bucket ducklake-poc already exists"
        else
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket ducklake-poc
        fi
    restart: "no"

  duckdb-loader:
    profiles: ["benchmark"]
    build: .
    command: ["python", "-u", "load_energy_market.py"]
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      <<: *duckdb-environment
      ENERGY_LOAD_ROWS: ${ENERGY_LOAD_ROWS:-20000000}
      ENERGY_GENERATION_ROWS: ${ENERGY_GENERATION_ROWS:-20000000}
      ENERGY_LMP_ROWS: ${ENERGY_LMP_ROWS:-10000000}
      ENERGY_LOAD_BATCH_ROWS: ${ENERGY_LOAD_BATCH_ROWS:-5000000}
      ENERGY_RESET: ${ENERGY_RESET:-false}
    volumes:
      - duckdb_extensions:/root/.duckdb
      - ./benchmark-results:/app/benchmark-results
    cpus: 6.0
    mem_limit: 8g
    restart: "no"

  duckdb-append-loader:
    profiles: ["scale"]
    build: .
    command: ["python", "-u", "load_parallel_append.py"]
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      <<: *duckdb-environment
      DUCKDB_THREADS: "10"
      DUCKDB_MEMORY_LIMIT: 8GB
      APPEND_MAX_ROWS: ${APPEND_MAX_ROWS:-2000000000}
      APPEND_TARGET_STORAGE_BYTES: ${APPEND_TARGET_STORAGE_BYTES:-32000000000}
      APPEND_WORKERS: ${APPEND_WORKERS:-10}
      APPEND_ROWS_PER_INSERT: ${APPEND_ROWS_PER_INSERT:-5000000}
      APPEND_MAX_RETRIES: ${APPEND_MAX_RETRIES:-5}
      APPEND_ASSET_COUNT: ${APPEND_ASSET_COUNT:-50000}
      APPEND_MAX_STORAGE_BYTES: ${APPEND_MAX_STORAGE_BYTES:-220000000000}
    volumes:
      - duckdb_extensions:/root/.duckdb
      - ./benchmark-results:/app/benchmark-results
    cpus: 10.0
    mem_limit: 10g
    restart: "no"

  duckdb-server:
    profiles: ["benchmark"]
    build: .
    command: ["python", "-u", "quack_server.py"]
    depends_on:
      duckdb-loader:
        condition: service_completed_successfully
    environment:
      <<: *duckdb-environment
    volumes:
      - duckdb_extensions:/root/.duckdb
      - ./benchmark-results:/app/benchmark-results
    ports:
      - "127.0.0.1:9494:9494"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',9494),2); s.close()",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    cpus: 6.0
    mem_limit: 8g
    restart: unless-stopped

  duckdb-scale-server:
    profiles: ["scale"]
    build: .
    command: ["python", "-u", "quack_server.py"]
    depends_on:
      duckdb-append-loader:
        condition: service_completed_successfully
    environment:
      <<: *duckdb-environment
    volumes:
      - duckdb_extensions:/root/.duckdb
      - ./benchmark-results:/app/benchmark-results
    ports:
      - "127.0.0.1:9494:9494"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',9494),2); s.close()",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    cpus: 6.0
    mem_limit: 8g
    restart: unless-stopped

  benchmark-client:
    profiles: ["benchmark"]
    build: .
    command: ["python", "-u", "benchmark_client.py"]
    depends_on:
      duckdb-loader:
        condition: service_completed_successfully
      duckdb-server:
        condition: service_healthy
    environment:
      <<: *duckdb-environment
      DUCKDB_THREADS: "2"
      DUCKDB_MEMORY_LIMIT: 1GB
      BENCHMARK_CONCURRENCY: ${BENCHMARK_CONCURRENCY:-1}
      BENCHMARK_REPETITIONS: ${BENCHMARK_REPETITIONS:-3}
      BENCHMARK_WARMUPS: ${BENCHMARK_WARMUPS:-1}
    volumes:
      - duckdb_extensions:/root/.duckdb
      - ./benchmark-results:/app/benchmark-results
    cpus: 2.0
    mem_limit: 2g
    restart: "no"

  duckdb-shell:
    profiles: ["benchmark"]
    build:
      context: .
      dockerfile: Dockerfile.shell
    command: ["sleep", "infinity"]
    depends_on:
      duckdb-loader:
        condition: service_completed_successfully
      duckdb-server:
        condition: service_healthy
    environment:
      <<: *duckdb-environment
      DUCKDB_THREADS: "2"
      DUCKDB_MEMORY_LIMIT: 2GB
    volumes:
      - ./benchmark-results:/app/benchmark-results
    stdin_open: true
    tty: true
    cpus: 2.0
    mem_limit: 2g
    restart: unless-stopped

  duckdb-scale-shell:
    profiles: ["scale"]
    build:
      context: .
      dockerfile: Dockerfile.shell
    command: ["sleep", "infinity"]
    depends_on:
      duckdb-append-loader:
        condition: service_completed_successfully
      duckdb-scale-server:
        condition: service_healthy
    environment:
      <<: *duckdb-environment
      QUACK_CLIENT_HOST: duckdb-scale-server
      DUCKDB_THREADS: "2"
      DUCKDB_MEMORY_LIMIT: 2GB
    volumes:
      - ./benchmark-results:/workspace/benchmark-results
    stdin_open: true
    tty: true
    cpus: 2.0
    mem_limit: 2g
    restart: unless-stopped

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
  duckdb_extensions:
